<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escape the Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1430;--fg:#f2f0e6;color-scheme:dark;box-sizing:border-box;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d1430;--fg:#f2f0e6;}}
:root[data-theme="dark"]{--bg:#0d1430;--fg:#f2f0e6;}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Rubik,system-ui,sans-serif}
canvas{position:fixed;inset:0;display:block}
#ov{pointer-events:none}
#gl{cursor:crosshair}
#load{position:fixed;inset:0;display:grid;place-items:center;font:600 18px Rubik,system-ui,sans-serif}
</style>
</head>
<body>
<div id="load">Loading the sports complex…</div>
<script src="three.min.js"></script>
<canvas id="ov"></canvas>
<script>
(()=>{
if(!window.THREE){document.getElementById('load').textContent='Could not load the 3D engine. Check your connection and reload.';return;}
const W=960,H=600;
const C={night:'#0d1430',light:'#f7f6ee',amber:'#ffb627',red:'#d7262e',turf:'#2f7d3a',turf2:'#2a7134',ink:'#0a0c18',blue:'#3b7dd8'};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b,c,d)=>Math.hypot(a-c,b-d);

// ---------- renderer + overlay ----------
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.domElement.id='gl';document.body.insertBefore(renderer.domElement,document.getElementById('ov'));
const camera=new THREE.PerspectiveCamera(60,1,.1,1500);
const ov=document.getElementById('ov'),octx=ov.getContext('2d');let ctx=octx;
let VS=1,VX=0,VY=0,DPR=1;
function resize(){const w=innerWidth,h=innerHeight;DPR=Math.min(2,devicePixelRatio||1);renderer.setPixelRatio(DPR);renderer.setSize(w,h);ov.width=w*DPR;ov.height=h*DPR;ov.style.width=w+'px';ov.style.height=h+'px';VS=Math.min(w/W,h/H);VX=(w-W*VS)/2;VY=(h-H*VS)/2;camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

// ---------- input ----------
const keys={},pressed=new Set(),mouse={nx:.5,ny:.5,clicked:false};let minusAt=-1e9;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(k==='-'||k==='_')minusAt=performance.now();if(!keys[k])pressed.add(k);keys[k]=true;});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
addEventListener('mousemove',e=>{mouse.nx=e.clientX/innerWidth;mouse.ny=e.clientY/innerHeight;});
renderer.domElement.addEventListener('mousedown',e=>{if(scene&&scene.fp&&!document.pointerLockElement&&renderer.domElement.requestPointerLock)renderer.domElement.requestPointerLock();mouse.nx=e.clientX/innerWidth;mouse.ny=e.clientY/innerHeight;mouse.clicked=true;});
const hit=k=>pressed.has(k),E=()=>hit('e')||mouse.clicked;
const U=()=>keys.w||keys.arrowup,Dn=()=>keys.s||keys.arrowdown,Lf=()=>keys.a||keys.arrowleft,Rt=()=>keys.d||keys.arrowright;
let lookAcc=0;addEventListener('mousemove',e=>{if(document.pointerLockElement)lookAcc+=e.movementX*.0028;});const takeLook=()=>{const v=lookAcc;lookAcc=0;return v;};
const skipCombo=()=>hit('0')&&(keys['-']||keys['_']||performance.now()-minusAt<1500);
const aimAngle=(mn,mx)=>(mn+(mx-mn)*(1-clamp(mouse.ny,0,1)))*Math.PI/180;
const aimPower=(mn,mx)=>mn+(mx-mn)*clamp(mouse.nx,0,1);

// ---------- sound ----------
let AC;function beep(f=440,d=.1,type='sine',v=.07){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
const cheer=()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16,'triangle',.08),i*90));
const buzz=()=>beep(110,.35,'sawtooth',.06),thud=()=>beep(90,.12,'square',.08);

// ---------- 2D helpers (overlay + textures) ----------
function txt(s,x,y,size=20,col=C.light,al='center',font='Rubik',wt='800'){ctx.font=`${wt} ${size}px ${font}, system-ui, sans-serif`;ctx.fillStyle=col;ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function wrap(s,x,y,maxW,lh,size,col,al='center',font='Rubik',wt='800'){ctx.font=`${wt} ${size}px ${font}, system-ui, sans-serif`;const words=s.split(' ');let line='',lines=[];for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}lines.push(line);lines.forEach((l,i)=>txt(l,x,y+i*lh,size,col,al,font,wt));return lines.length;}
const box=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
function circ(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();}
function rr(x,y,w,h,r,c){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=c;ctx.fill();}
function line(x1,y1,x2,y2,c,w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function scoreboard(label,val,x=W/2,y=62){rr(x-150,y-24,300,48,6,'rgba(5,6,12,.88)');txt(label,x-140,y,15,'#8f93ab','left');txt(val,x+138,y,26,C.amber,'right','Bungee','400');}
function hint(s){rr(W/2-340,H-42,680,30,15,'rgba(5,6,12,.78)');txt(s,W/2,H-27,14,'#e4e2d6','center','Rubik','600');}
function banner(s,col=C.amber,sub){rr(W/2-300,H/2-60,600,sub?120:90,12,'rgba(5,6,12,.88)');txt(s,W/2,H/2-(sub?18:15),34,col,'center','Bungee','400');if(sub)wrap(sub,W/2,H/2+26,540,22,16,'#e7e4d8','center','Rubik','600');}
function fullTint(c){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=c;ctx.fillRect(0,0,ov.width,ov.height);ctx.restore();}
function panel(x,y,w,h){rr(x,y,w,h,8,'rgba(5,6,12,.85)');}

// ---------- 3D helpers ----------
function texCanvas(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const prev=ctx;ctx=c.getContext('2d');fn(w,h);ctx=prev;const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;}
const M=(c,o={})=>new THREE.MeshLambertMaterial({color:c,...o});
const MB=(c,o={})=>new THREE.MeshBasicMaterial({color:c,...o});
const mat=c=>(c&&c.isMaterial)?c:M(c);
function bx(w,h,d,c,x,y,z,p){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);p.add(m);return m;}
function sph(r,c,x,y,z,p){const m=new THREE.Mesh(new THREE.SphereGeometry(r,18,14),mat(c));m.position.set(x,y,z);p.add(m);return m;}
function cyl(rt,rb,h,c,x,y,z,p,seg=16){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat(c));m.position.set(x,y,z);p.add(m);return m;}
function flat(w,h,c,x,y,z,p){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),c&&c.isMaterial?c:M(c));m.rotation.x=-Math.PI/2;m.position.set(x,y,z);p.add(m);return m;}
function sprite(tex,sw,sh,p,x,y,z){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));s.scale.set(sw,sh,1);s.position.set(x,y,z);p.add(s);return s;}
function signTex(head,body,extra){return texCanvas(512,extra?300:240,(w,h)=>{rr(8,8,w-16,h-16,22,'#f4e9c8');ctx.strokeStyle='#4b3624';ctx.lineWidth=8;ctx.strokeRect(14,14,w-28,h-28);txt(head,w/2,54,30,C.red,'center','Bungee','400');wrap(body,w/2,112,450,46,38,'#1d1a12','center','Bungee','400');if(extra)txt(extra,w/2,h-48,22,'#6a5a3a','center','Rubik','700');});}
function labelTex(s,size=40,col='#ffb627',bg='rgba(5,6,12,.8)'){return texCanvas(512,96,(w,h)=>{rr(4,8,w-8,h-16,40,bg);txt(s,w/2,h/2,size,col,'center','Rubik','800');});}
function emojiTex(e){return texCanvas(128,128,()=>txt(e,64,70,96,'#fff','center','Rubik','400'));}
function newWorld(bg=0x0d1430,fog=[60,260]){const w=new THREE.Scene();w.background=new THREE.Color(bg);if(fog)w.fog=new THREE.Fog(bg,fog[0],fog[1]);w.add(new THREE.HemisphereLight(0xd8e4ff,0x2a2a3a,.8));const d=new THREE.DirectionalLight(0xffffff,.75);d.position.set(12,30,18);w.add(d);return w;}
function stars(w){const g=new THREE.BufferGeometry(),n=600,a=new Float32Array(n*3);for(let i=0;i<n;i++){const t=Math.random()*Math.PI*2,p=Math.random()*1.2+.15,r=600;a[i*3]=Math.cos(t)*Math.cos(p)*r;a[i*3+1]=Math.sin(p)*r;a[i*3+2]=Math.sin(t)*Math.cos(p)*r;}g.setAttribute('position',new THREE.BufferAttribute(a,3));w.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:2,sizeAttenuation:false,fog:false})));}
function stadium(w,len=160,wide=70){
 const t=texCanvas(256,256,()=>{for(let i=0;i<8;i++)box(0,i*32,256,32,i%2?C.turf:C.turf2);});t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(wide/16,len/16);
 flat(wide*3,len+80,M(0xffffff,{map:t}),0,0,-len/2+20,w);
 for(const s of[-1,1]){const st=new THREE.Group();st.position.set(s*(wide/2+8),0,-len/2+20);w.add(st);for(let i=0;i<6;i++)bx(4,1.4+i*1.4,len*.9,i%2?0x1b2550:0x232d5e,s*i*3,(1.4+i*1.4)/2,0,st);
  for(const z of[10,-len+20]){cyl(.4,.6,30,0x3a4166,s*(wide/2+4),15,z,w);bx(6,2.6,1,0x3a4166,s*(wide/2+4),30.5,z,w);for(let i=0;i<4;i++)sph(.5,MB(0xfffbe0),s*(wide/2+4)-2.1+i*1.4,30.5,z+.6,w);}}
 stars(w);
}
function person(col,skin=0xf2c79b){const g=new THREE.Group(),m=M(col),dk=M(0x22232f);
 const torso=bx(.52,.72,.3,m,0,1.16,0,g),head=sph(.17,skin,0,1.7,0,g);
 const limb=(x,y,len,wd,mm)=>{const p=new THREE.Group();p.position.set(x,y,0);g.add(p);bx(wd,len,wd,mm,0,-len/2,0,p);return p;};
 g.userData={lL:limb(-.13,.8,.8,.17,dk),rL:limb(.13,.8,.8,.17,dk),lA:limb(-.34,1.48,.66,.13,m),rA:limb(.34,1.48,.66,.13,m),torso,head,m};
 const sh=flat(.9,.9,MB(0,{transparent:true,opacity:.3,map:texCanvas(64,64,()=>circ(32,32,30,'#000'))}),0,.02,0,g);return g;}
function walk(p,ph,amt=1){const u=p.userData,s=Math.sin(ph)*.7*amt;u.lL.rotation.x=s;u.rL.rotation.x=-s;u.lA.rotation.x=-s;u.rA.rotation.x=s;}
function aimLine(w,col=0xffb627){const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:col}));l.frustumCulled=false;w.add(l);return{l,set(a,b){const p=g.attributes.position;p.setXYZ(0,a.x,a.y,a.z);p.setXYZ(1,b.x,b.y,b.z);p.needsUpdate=true;}};}
function trailLine(w,n=80){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));g.setDrawRange(0,0);const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.5}));l.frustumCulled=false;w.add(l);const pts=[];return{push(v){pts.push(v.clone());if(pts.length>n)pts.shift();pts.forEach((p,i)=>g.attributes.position.setXYZ(i,p.x,p.y,p.z));g.attributes.position.needsUpdate=true;g.setDrawRange(0,pts.length);},clear(){pts.length=0;g.setDrawRange(0,0);}};}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
function look(px,py,pz,tx,ty,tz,k=1){camera.position.lerp(V(px,py,pz),k);camera.lookAt(tx,ty,tz);}
const lookV=V(0,1,-10);function fp(px,py,pz,tx,ty,tz,k=1){camera.position.set(px,py,pz);lookV.lerp(V(tx,ty,tz),Math.min(1,k));camera.lookAt(lookV);}
function crosshair(){circ(W/2,H/2,3,'rgba(255,255,255,.85)');ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(W/2,H/2,4,0,7);ctx.stroke();}
function disposeWorld(w){w.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{if(m.map)m.map.dispose();m.dispose();});}});}

// ---------- game state ----------
let scene,clock=0,running=false,toastMsg='',toastT=0,shake=0;
let G={stage:0,done:[]},hubs={};
const toast=(m,t=2.4)=>{toastMsg=m;toastT=t};
function setScene(s){if(!s.fp&&document.pointerLockElement)document.exitPointerLock();if(scene&&scene.world&&!scene.keep&&scene.world!==s.world)disposeWorld(scene.world);scene=s;s.enter&&s.enter();}
const STAGES=[
 {name:'Football Field',clue:'KICK A FIELD GOAL',station:'Kicking tee',icon:'🏈',theme:'field',make:()=>FieldGoal()},
 {name:'Basketball Gym',clue:'SHOOT A BASKETBALL',station:'3-point line',icon:'🏀',theme:'court',make:()=>Hoops()},
 {name:'The Track',clue:'RUN! BEAT TREVOR BASSET',station:'Starting blocks',icon:'🏃',theme:'track',make:()=>Hurdles()},
 {name:'Bowling Alley',clue:'GET ALL STRIKES',station:'Lane 1',icon:'🎳',theme:'bowling',make:()=>Bowling()},
 {name:'Tennis Court',clue:'WIN IN TENNIS',station:'Baseline',icon:'🎾',theme:'tennis',make:()=>Tennis()},
 {name:'Golf Simulator',clue:'GET A HOLE IN ONE',station:'Hitting mat',icon:'⛳',theme:'golf',make:()=>Golf()},
 {name:'Soccer Field',clue:'SCORE A GOAL',station:'Free kick spot',icon:'⚽',theme:'soccer',make:()=>FreeKick()},
 {name:'Baseball Field',clue:'HIT A HOME RUN',station:"Batter's box",icon:'⚾',theme:'baseball',make:()=>Batting()},
 {name:'Boxing Ring',clue:'TRY TO BEAT THE CHAMP',station:'The ring',icon:'🥊',theme:'boxing',make:()=>Boxing()},
 {name:'Weight Room',clue:'BENCH 500 LBS',station:'Bench press',icon:'🏋️',theme:'weights',make:()=>Bench()},
 {name:'The Lobby',clue:"DON'T GET CAUGHT BY THE GUARDS. RUN!",lobby:true}
];
const hubFor=i=>hubs[i]||(hubs[i]=Hub(i));
function winStage(m){G.done[G.stage]=true;const h=hubFor(G.stage);h.refresh();setScene(h);toast('🔓 '+(m||'CLICK! The doggy door unlocked!'),3.4);cheer();}
function nextStage(){G.stage++;const st=STAGES[G.stage];setScene(st.lobby?Lobby():hubFor(G.stage));toast('Entered: '+st.name,2.2);beep(300,.1,'triangle');}
function newGame(){G={stage:0,done:[]};for(const k in hubs)disposeWorld(hubs[k].world);hubs={};clock=0;running=true;setScene(hubFor(0));toast('Every door just clicked shut behind you...',3);}

// ---------- room floor textures ----------
function floor(theme){
 switch(theme){
 case'field':for(let i=0;i<12;i++)box(i*80,0,80,H,i%2?C.turf:C.turf2);for(let i=1;i<12;i++)line(i*80,30,i*80,570,'rgba(255,255,255,.5)',3);break;
 case'court':box(0,0,W,H,'#c48a4f');for(let y=0;y<H;y+=24)line(0,y,W,y,'rgba(90,50,20,.25)',1);box(380,400,200,170,'#a51d24');ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.strokeRect(380,400,200,170);ctx.beginPath();ctx.arc(480,300,70,0,7);ctx.stroke();line(30,300,930,300,'#fff',4);break;
 case'track':box(0,0,W,H,'#b8452f');for(let x=90;x<900;x+=60)line(x,0,x,H,'rgba(255,255,255,.75)',3);break;
 case'bowling':box(0,0,W,H,'#2a1d3a');for(let i=0;i<6;i++){const x=110+i*130;box(x,30,90,540,'#d9a86a');box(x-10,30,10,540,'#191226');box(x+90,30,10,540,'#191226');}break;
 case'tennis':box(0,0,W,H,'#2f6b3d');box(140,70,680,460,'#2d5fa8');ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(140,70,680,460);line(140,300,820,300,'#fff',3);line(200,70,200,530,'#fff',3);line(760,70,760,530,'#fff',3);break;
 case'golf':box(0,0,W,H,'#1c3a2a');for(let y=0;y<H;y+=6)line(0,y,W,y,'rgba(0,0,0,.08)',1);break;
 case'soccer':box(0,0,W,H,C.turf);ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(480,300,80,0,7);ctx.stroke();line(30,300,930,300,'rgba(255,255,255,.7)',3);ctx.strokeRect(350,30,260,120);break;
 case'baseball':box(0,0,W,H,C.turf);ctx.save();ctx.translate(480,300);ctx.rotate(Math.PI/4);box(-120,-120,240,240,'#b98455');box(-95,-95,190,190,C.turf2);ctx.restore();break;
 case'boxing':box(0,0,W,H,'#14161f');rr(300,120,360,360,4,'#2a57b8');break;
 case'weights':box(0,0,W,H,'#30323a');for(let x=0;x<W;x+=80)for(let y=0;y<H;y+=80){ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=2;ctx.strokeRect(x,y,80,80);}break;
 case'lobby':for(let x=0;x<W;x+=60)for(let y=0;y<H;y+=60)box(x,y,60,60,((x+y)/60)%2?'#2b2e3d':'#33374a');break;
 }
}
const toX=x=>(x-480)/20,toZ=y=>(y-300)/20;
function roomShell(w,theme){const f=flat(48,30,MB(0xffffff,{map:texCanvas(960,600,()=>floor(theme))}),0,0,0,w);const wc=0x1a1d2e;bx(48,5,1.5,wc,0,2.5,-14.25,w);bx(48,.8,1.5,wc,0,.4,14.25,w);bx(1.5,5,30,wc,-23.25,2.5,0,w);bx(1.5,5,30,wc,23.25,2.5,0,w);
 const L=new THREE.PointLight(0xfff2d0,.6,60);L.position.set(0,14,0);w.add(L);}
function roomProps(w,theme){
 const g=new THREE.Group();w.add(g);
 if(theme==='court'){bx(.1,3.6,.1,0x4a4f6a,0,1.8,-12.8,g);bx(1.8,1.1,.06,0xe8ecf5,0,3.6,-12.6,g);const r=new THREE.Mesh(new THREE.TorusGeometry(.4,.04,8,24),M(0xff7a1a));r.rotation.x=Math.PI/2;r.position.set(0,3.05,-12.1);g.add(r);}
 if(theme==='field'||theme==='soccer'){const y=0xf5c518;if(theme==='field'){cyl(.12,.12,3,y,0,1.5,-12.5,g);bx(6,.2,.2,y,0,3,-12.5,g);cyl(.1,.1,4,y,-3,5,-12.5,g);cyl(.1,.1,4,y,3,5,-12.5,g);}else{const wt=0xffffff;cyl(.1,.1,2.4,wt,-3.6,1.2,-12.8,g);cyl(.1,.1,2.4,wt,3.6,1.2,-12.8,g);bx(7.4,.2,.2,wt,0,2.4,-12.8,g);}}
 if(theme==='tennis'){bx(34,1,.08,0xeeeeee,0,.5,0,g);}
 if(theme==='bowling'){for(let i=0;i<6;i++)for(let k=0;k<3;k++)cyl(.15,.15,.6,0xffffff,toX(155+i*130)+(k-1)*.4,.3,-11.8,g);}
 if(theme==='golf'){bx(18,6,.2,0x9dd3ff,0,3.5,-13.3,g);bx(18,2,.25,0x56a44a,0,1.5,-13.25,g);}
 if(theme==='baseball'){bx(.8,.05,.8,0xffffff,0,.05,6,g);}
 if(theme==='boxing'){for(const[x,z]of[[-9,-9],[9,-9],[-9,9],[9,9]])cyl(.2,.2,2.4,0xcccccc,x*.95,1.2,z*.95,g);for(let i=0;i<3;i++){const y=.8+i*.55,c=C.red;for(const s of[-1,1]){bx(17,.08,.08,0xd7262e,0,y,s*8.55,g);bx(.08,.08,17,0xd7262e,s*8.55,y,0,g);}}}
